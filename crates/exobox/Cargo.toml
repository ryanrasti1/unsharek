[package]
name = "exobox"
version = "0.0.0"
description = "Unmodified Linux programs on an in-process Linux kernel (LKL), behind a strict seccomp filter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "exobox"
path = "src/main.rs"

[dependencies]
clap.workspace = true
exobox-erofs = { path = "../erofs" }
# The in-sandbox runtime: boot, the gate, routing, exec; given the inventory's resources
exobox-rt = { path = "../rt" }
# Errno, the runtime's error type, in the hooks' adapters (src/net.rs)
rustix.workspace = true
# The global allocator after lockdown (src/alloc.rs): the hooks' and the executor's allocations,
# from a region reserved before it
talc = { version = "5", default-features = false }
# The hooks' stream traits (futures-io's AsyncRead/AsyncWrite, futures-core's Stream)
futures-io = "0.3"
futures-core = "0.3"
# tokio's AsyncRead/AsyncWrite too, for providers built on them (capnweb-rs's channel)
tokio = { version = "1", default-features = false, optional = true }
# The API's host calls before lockdown (the auxiliary vector, entropy, the reservations, fcntl,
# fork, the pidfd)
libc.workspace = true
thiserror.workspace = true
# The TCB: lockdown's checks and the filter (crates/tcb/ at the repository's root)
exobox-tcb = { path = "../tcb" }
[features]
tokio = ["dep:tokio"]
# The runtime's measurement counters, printed at the sandbox's end (exobox-rt's src/stats.rs).
stats = ["exobox-rt/stats"]

# build.rs: the binary's fixed-address link (the C compiler's PIE start files)
[build-dependencies]
exobox-build = { path = "../build" }

[dev-dependencies]
exobox-fixtures = { path = "../fixtures" }
# the suite's sysaudit table: syscall names by number
syscalls.workspace = true
libtest-mimic.workspace = true
tempfile.workspace = true

# The regression suite: one table of cases, each run natively and in every mode it names.
[[test]]
name = "suite"
harness = false

# The library's layers (Guest alone, Sandbox), each in a child process of its own.
[[test]]
name = "guest"
harness = false

# The program's network through the hooks (a provider over one held fd), and a passed fd's
# readiness; each case a sandbox in a child process.
[[test]]
name = "net"
harness = false

# The performance budgets (./test --perf).
[[test]]
name = "perf"
harness = false
