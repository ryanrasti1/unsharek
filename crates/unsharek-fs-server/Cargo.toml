[package]
name = "unsharek-fs-server"
version = "0.0.0"
description = "Plugin (experimental): serves a host directory to a sandbox's virtio-fs device, from a process of its own confined by Landlock and a proven seccomp filter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The server itself; without it, only its filter (the policy and its proof: `cargo kani
# --no-default-features`, which then needn't compile fuse-backend-rs)
default = ["serve"]
serve = ["dep:fuse-backend-rs", "dep:landlock", "dep:rustix"]

[dependencies]
# virtiofsd's passthrough file system, as a library over byte buffers
fuse-backend-rs = { version = "0.14", default-features = false, features = ["fusedev"], optional = true }
# The server's confinement to its directory
landlock = { version = "0.4", optional = true }
rustix = { workspace = true, features = ["process", "thread", "fs", "std"], optional = true }
libc = "0.2"
# The server's filter: a plain function, compiled (seccomp-fn) and proven (seccomp-fn-verify)
seccomp-fn = { path = "../../seccomp-fn/seccomp-fn" }
seccomp-fn-verify = { path = "../../seccomp-fn/seccomp-fn-verify" }
unsharek-fs = { path = "../unsharek-fs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dev-dependencies]
tempfile.workspace = true
