[package]
name = "unsharek-net"
version = "0.0.0"
description = "Plugin (experimental): the network provider, a host process that makes the sandbox's connections under a policy and passes them in over a control socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The control socket's protocol: Cap'n Web over its packet transport (vendor/capnweb-rs, a patched
# copy: vendor/capnweb-rs/PATCHES.md)
capnweb = { package = "capnweb-rs", path = "../../vendor/capnweb-rs", default-features = false, features = ["std", "local-runtime"] }
# The provider's own filter: a policy function compiled to BPF (not trusted) and proven equal to it
seccomp-fn = { path = "../../seccomp-fn/seccomp-fn" }
seccomp-fn-verify = { path = "../../seccomp-fn/seccomp-fn-verify" }
libc.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
