[package]
name = "capnweb-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "An idiomatic Rust implementation of the Cap'n Web RPC protocol"
license = "MIT"
repository = "https://github.com/cloudflare/capnweb"
publish = false

[lib]
name = "capnweb"

[features]
default = ["std", "stack-growth", "tokio", "websocket"]
# The standard library: thread-local recording state, caught panics.
# Without it the crate is `#![no_std]` + `alloc` (see `runtime.md`).
std = [
    "base64/std",
    "futures/executor",
    "futures/std",
    "num-bigint/std",
    "serde/std",
    "serde_json/std",
    "thiserror/std",
]
# Stack growth for deep messages (`stacker`, `serde_stacker`): a message is parsed and evaluated at
# any depth up to `RpcLimits::max_depth`, on stack segments mapped as needed. Without it (and
# always without std) JSON nesting is bounded by `MAX_JSON_DEPTH` and nothing maps a stack: for an
# embedder on a small fixed stack that can't make syscalls while handling a message.
stack-growth = ["std", "dep:serde_stacker", "dep:stacker", "serde_json/unbounded_depth"]
# Tokio as the runtime when no other is entered, and the transports built on it: framed streams,
# Unix-domain sockets, byte channels, HTTP batch.
tokio = ["std", "dep:tokio", "dep:rustix"]
# the WebSocket transport (tokio-tungstenite)
websocket = ["tokio", "dep:tokio-tungstenite"]
# `capnweb::local`: a single-threaded executor with a virtual clock, a `Runtime` for tests and
# small embedders. Works without std.
local-runtime = []

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
capnweb-macros = { path = "macros" }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = "0.2"
num-bigint = { version = "0.4", default-features = false }
rustix = { version = "1", features = ["net"], optional = true }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_stacker = { version = "0.1", optional = true }
spin = { version = "0.10", default-features = false, features = ["spin_mutex", "once"] }
stacker = { version = "0.1", optional = true }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"], optional = true }

