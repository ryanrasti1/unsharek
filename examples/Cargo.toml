[package]
name = "exobox-examples"
version = "0.0.0"
description = "Small programs showing exobox's library API (examples/README.md walks through them)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
exobox = { path = "../native/exobox" }
# setup: an image built from a directory
exobox-erofs = { path = "../native/erofs" }
# threads: par_compute, a small C guest
exobox-fixtures = { path = "../native/fixtures" }
# the parents' side: fds into children, wait4 for the sandbox's rusage
libc.workspace = true
# net-policy: the provider's streams
futures-io = "0.3"
tempfile.workspace = true

# the binaries' fixed-address link
[build-dependencies]
exobox-build = { path = "../native/build" }
