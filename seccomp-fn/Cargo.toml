# seccomp-fn: its own repository-to-be, a workspace of its own (unsharek's root workspace excludes
# it; unsharek-tcb depends on it by path).
[workspace]
resolver = "3"
members = ["seccomp-fn", "seccomp-fn-verify"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.dev]
panic = "abort"
