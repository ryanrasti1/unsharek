[package]
name = "seccomp-fn"
description = "compile!: a seccomp policy, a plain Rust function, compiled to classic BPF (not trusted: seccomp-fn-validate proves its output)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
libc = "0.2"
seccomp-fn-validate = { path = "../seccomp-fn-validate" }

[lints]
workspace = true
