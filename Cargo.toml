[workspace]
resolver = "3"
members = ["examples", "native/build", "native/erofs", "native/exobox", "native/fixtures", "native/guest-tests", "native/kit", "native/lkl-sys", "native/rt"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
repository = "https://github.com/ryanrasti/exobox"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# raw Linux syscalls, no libc: the runtime after lockdown
rustix = { version = "1", default-features = false }
syscalls = "0.6"
thiserror = "2"
# native/lkl-sys's build.rs: Rust declarations from the kernel's headers
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
# tests
cc = "1"
libtest-mimic = "0.8"
tempfile = "3"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.dev]
panic = "abort"
debug = 1

[profile.release]
panic = "abort"
