[workspace]
resolver = "3"
members = ["examples", "xtask", "crates/unsharek-tcb", "crates/unsharek-build", "crates/unsharek-erofs", "crates/unsharek", "crates/unsharek-fixtures", "crates/guest-tests", "crates/lkl-sys", "crates/unsharek-rt", "crates/unsharek-fs", "crates/unsharek-fs-server", "crates/unsharek-net"]
# seccomp-fn is its own repository and workspace (the submodule seccomp-fn/); unsharek-tcb, also a
# submodule, depends on it by a pinned git commit, patched below to the checkout here.
exclude = ["seccomp-fn", "vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
repository = "https://github.com/ryanrasti/exobox"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# raw Linux syscalls, no libc: the runtime after lockdown
rustix = { version = "1", default-features = false }
syscalls = "0.6"
thiserror = "2"
# crates/lkl-sys's build.rs: Rust declarations from the kernel's headers
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
# tests
cc = "1"
libtest-mimic = "0.8"
tempfile = "3"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.dev]
panic = "abort"
debug = 1

[profile.release]
panic = "abort"

# unsharek-tcb's pinned seccomp-fn is the submodule's checkout: one package with the path
# dependencies above, and a submodule bump moves both.
[patch."ssh://git@github.com/ryanrasti1/seccomp-fn.git"]
seccomp-fn = { path = "seccomp-fn/seccomp-fn" }
seccomp-fn-verify = { path = "seccomp-fn/seccomp-fn-verify" }
