[workspace]
resolver = "3"
members = ["examples", "xtask", "crates/unsharek-tcb", "crates/unsharek-build", "crates/unsharek-erofs", "crates/unsharek", "crates/unsharek-fixtures", "crates/guest-tests", "crates/lkl-sys", "crates/unsharek-rt", "crates/unsharek-fs", "seccomp-fn-verify"]
# The filter's compiler and its proof, each its own repository, here as submodules: the submodules'
# commits are the pins (unsharek-tcb takes both from [workspace.dependencies], by path).
# seccomp-fn's repository is a workspace of its own (its crate is seccomp-fn/seccomp-fn), so it
# is a path dependency, not a member.
exclude = ["seccomp-fn"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryanrasti/exobox"

[workspace.dependencies]
seccomp-fn = { path = "seccomp-fn/seccomp-fn" }
seccomp-fn-verify = { path = "seccomp-fn-verify" }
clap = { version = "4", features = ["derive"] }
# raw Linux syscalls, no libc: the runtime after lockdown
rustix = { version = "1", default-features = false }
syscalls = "0.6"
thiserror = "2"
# crates/lkl-sys's build.rs: Rust declarations from the kernel's headers
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
# tests
cc = "1"
libtest-mimic = "0.8"
tempfile = "3"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.dev]
panic = "abort"
debug = 1

[profile.release]
panic = "abort"

# seccomp-fn's own workspace names seccomp-fn-verify by git (for building it alone): here it is
# the submodule, the one the tcb compiles with, so nothing is fetched.
[patch."ssh://git@github.com/ryanrasti1/seccomp-fn-verify.git"]
seccomp-fn-verify = { path = "seccomp-fn-verify" }
