[workspace]
resolver = "3"
members = ["examples", "xtask", "crates/unsharek-tcb", "crates/unsharek-build", "crates/unsharek-erofs", "crates/unsharek", "crates/unsharek-fixtures", "crates/guest-tests", "crates/lkl-sys", "crates/unsharek-rt", "crates/unsharek-fs", "crates/unsharek-fs-server"]
# its own workspace (its own repository to be): unsharek-tcb depends on it by path
exclude = ["seccomp-fn"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
repository = "https://github.com/ryanrasti/exobox"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# raw Linux syscalls, no libc: the runtime after lockdown
rustix = { version = "1", default-features = false }
syscalls = "0.6"
thiserror = "2"
# crates/lkl-sys's build.rs: Rust declarations from the kernel's headers
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
# tests
cc = "1"
libtest-mimic = "0.8"
tempfile = "3"
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.dev]
panic = "abort"
debug = 1

[profile.release]
panic = "abort"
