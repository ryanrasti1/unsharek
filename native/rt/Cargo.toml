[package]
name = "exobox-rt"
version = "0.0.0"
description = "exobox's in-sandbox runtime: what runs after lockdown, in the SIGSYS handler and on the guest kernel's behalf"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# thread: prctl(PR_SET_NO_NEW_PRIVS) before installing the filter
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
# fork and waitpid for the filter's real-kernel test
libc = { workspace = true }
