[package]
name = "exobox"
version = "0.0.0"
description = "Unmodified Linux programs on an in-process Linux kernel (LKL), behind a strict seccomp filter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "exobox"
path = "src/main.rs"

[dependencies]
clap.workspace = true
exobox-erofs = { path = "../erofs" }
# The in-sandbox runtime (the dispatcher, the scheduler, the filter) and the kernel's numbers
exobox-rt = { path = "../rt" }
lkl-sys = { path = "../lkl-sys" }
# Host setup before the routing filter: reserving memory, mapping images, the auxiliary vector,
# host entropy; and the guest's constants
libc.workspace = true
syscalls.workspace = true
thiserror.workspace = true

[dev-dependencies]
exobox-fixtures = { path = "../fixtures" }
libtest-mimic.workspace = true
tempfile.workspace = true

# The regression suite: one table of cases, each run natively and in every mode it names.
[[test]]
name = "suite"
harness = false

# The library's layers (Guest alone, Sandbox), each in a child process of its own.
[[test]]
name = "guest"
harness = false

# The performance budgets (./test --perf).
[[test]]
name = "perf"
harness = false
